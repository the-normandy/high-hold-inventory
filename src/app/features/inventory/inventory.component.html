<main class="report-page">
    <header class="report-header">
        <div>
            <p class="text-sm font-medium opacity-60">Reports</p>
            <h1 class="text-3xl">{{mode() === 'deposit' ? 'Deposit' : 'Withdrawal'}} report</h1>
        </div>
        <a matButton="tonal" routerLink="/"><mat-icon>arrow_back</mat-icon>Back</a>
    </header>

    <div class="report-content">
    <div class="section-switcher">
        <span class="font-medium">Include in report</span>
        <mat-checkbox [checked]="shouldRenderMaterial()" (change)="shouldRenderMaterial.set($event.checked)">Materials</mat-checkbox>
        <mat-checkbox [checked]="shouldRenderCraft()" (change)="shouldRenderCraft.set($event.checked)">Crafted items</mat-checkbox>
    </div>

    @if (shouldRenderMaterial()) {
        <app-material [form]="materialForm"></app-material>
    }
    @if (shouldRenderCraft()) {
        <app-craft [form]="craftForm"></app-craft>
    }

    <div class="report-actions">
        <a matButton="tonal" routerLink="/records">View ledger</a>
        <button matButton="filled" (click)="submit()" [disabled]="!shouldRenderMaterial() && !shouldRenderCraft()">Generate report</button>
    </div>
    </div>
</main>
