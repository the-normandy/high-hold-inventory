<h2 mat-dialog-title>Set up item data</h2>
<form class="contents" (submit)="$event.preventDefault()">
    <mat-dialog-content class="py-2!">
        <div class="flex gap-4">
            <mat-icon class="shrink-0 text-(--mat-sys-primary)">inventory_2</mat-icon>
            <div class="flex flex-col gap-2">
                <p><strong>prices.json</strong> was not found in the application data folder.</p>
                <p class="text-sm opacity-70">Create a new empty file with the required Materials and Craft roots. You can add categories and items from Data management afterward.</p>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button type="button" matButton="tonal" [mat-dialog-close]="false">Not now</button>
        <button type="submit" matButton="filled" [mat-dialog-close]="true">Create file</button>
    </mat-dialog-actions>
</form>
