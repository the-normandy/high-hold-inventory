<h2 mat-dialog-title>Previous app data found</h2>
<mat-dialog-content>
    <div class="flex gap-4">
        <mat-icon class="shrink-0 text-(--mat-sys-primary)">drive_file_move</mat-icon>
        <div class="flex flex-col gap-3">
            <p>We've noticed you just created your first profile. Would you like to migrate your previous app data to this profile?</p>
            <ul class="list-inside list-disc text-sm opacity-70">
                @for (file of files; track file) {
                    <li>{{file}}</li>
                }
            </ul>
            <p class="text-sm opacity-70">The original files will remain in the app folder.</p>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button type="button" matButton="tonal" [mat-dialog-close]="false">No, start fresh</button>
    <button type="button" matButton="filled" [mat-dialog-close]="true">Migrate data</button>
</mat-dialog-actions>
