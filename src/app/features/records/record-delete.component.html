<h2 mat-dialog-title>Confirm deletion</h2>
<form class="contents" (submit)="$event.preventDefault()">
    <mat-dialog-content class="py-2!">
        <span>Are you sure you want to delete this record? This action cannot be reversed.</span>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button type="submit" matButton="filled" class="w-24" [mat-dialog-close]="true">Confirm</button>
        <button type="button" matButton="tonal" class="w-24" [mat-dialog-close]="false">Cancel</button>
    </mat-dialog-actions>
</form>
