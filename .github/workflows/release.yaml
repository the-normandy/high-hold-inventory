name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json

          if ($config.version -ne $tagVersion) {
            throw "Release tag version '$tagVersion' does not match tauri.conf.json version '$($config.version)'."
          }

      - name: Clear previous bundle artifacts
        shell: pwsh
        run: Remove-Item "src-tauri/target/release/bundle" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build frontend + Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "Missing updater signature for '$($installer.Name)'."
          }

          $sig = (Get-Content $sigPath -Raw).Trim()

          $version = "${{ github.ref_name }}".TrimStart("v")
          $assetName = [Uri]::EscapeDataString($installer.Name)

          $json = @{
            version = $version
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/the-normandy/high-hold-inventory/releases/download/${{ github.ref_name }}/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 10

          $json | Out-File "src-tauri/target/release/bundle/nsis/latest.json" -Encoding utf8

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}